[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "basat"
version = "0.1.0"
description = "A typed, reproducible library of Bayesian optimization algorithms and environments."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "Basat contributors" }]
keywords = ["bayesian-optimization", "gaussian-processes", "robust-optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26.4,<3",
  "scipy>=1.12,<2",
  "torch>=2.6,<2.11",
  "gpytorch>=1.14,<1.16",
  "botorch>=0.15,<0.18",
  "cma>=4,<5",
  "scikit-learn>=1.5,<2",
  "threadpoolctl>=3.1,<4",
  "pyro-ppl>=1.9,<2",
  "jax[cpu]>=0.7.0,<0.11",
  "numpyro>=0.21,<0.22",
  "cvxpy>=1.6,<2",
  "matplotlib>=3.9,<4",
  "umap-learn>=0.5.7,<0.6",
  "ipykernel>=7,<8",
  "ipywidgets>=8.1,<9",
  "jupyterlab>=4,<5",
  "nbformat>=5,<6",
  "nbclient>=0.10,<1",
  "reportlab>=4,<6",
  "pypdf>=6,<7",
]

[project.scripts]
basat = "basat.__main__:main"

[project.optional-dependencies]
# Numerical compatibility for the AdveRS camera-ready source, in a separate
# environment. Ordinary installations retain the latest compatible stack.
advers-source = [
  "numpy==1.26.4",
  "scipy==1.12.0",
  "scikit-learn==1.7.2",
  "cvxpy>=1.6,<1.7",
  "jax[cpu]==0.7.0",
  "numpyro==0.21.0",
]
optimizers = ["cma>=4,<5"]
tree = ["scikit-learn>=1.5,<2"]
mcmc = ["pyro-ppl>=1.9,<2"]
# Retained as an alias for installations that previously selected this extra.
numpyro = []
robust = ["cvxpy>=1.6,<2"]
notebook = [
  "ipykernel>=7,<8",
  "ipywidgets>=8.1,<9",
]
viz = [
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "umap-learn>=0.5.7,<0.6",
]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "hypothesis>=6.100,<7",
  "pillow>=11,<13",
]
dev = [
  "cma>=4,<5",
  "scikit-learn>=1.5,<2",
  "pyro-ppl>=1.9,<2",
  "cvxpy>=1.6,<2",
  "matplotlib>=3.9,<4",
  "umap-learn>=0.5.7,<0.6",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "hypothesis>=6.100,<7",
  "pillow>=11,<13",
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "ruff>=0.9,<1",
]
full = [
  "cma>=4,<5",
  "scikit-learn>=1.5,<2",
  "pyro-ppl>=1.9,<2",
  "cvxpy>=1.6,<2",
  "matplotlib>=3.9,<4",
  "umap-learn>=0.5.7,<0.6",
  "ipykernel>=7,<8",
  "ipywidgets>=8.1,<9",
]

[project.urls]
Documentation = "https://github.com/Bilkent-CYBORG/bayopy"
Source = "https://github.com/Bilkent-CYBORG/bayopy"

[tool.hatch.build.targets.wheel]
packages = ["basat"]

[tool.hatch.build]
exclude = [
  "**/__pycache__/**",
  ".coverage",
  ".hypothesis/**",
  ".mypy_cache/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  ".vscode/**",
  "**/.DS_Store",
  "coverage*.json",
  "dist/**",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: paper/source regression or expensive numerical test",
  "optional: requires a capability extra",
  "optimizers: requires the optimizers capability extra",
  "tree: requires the tree capability extra",
  "mcmc: requires the mcmc capability extra",
  "robust: requires the robust capability extra",
  "viz: requires the viz capability extra",
  "accelerator: requires CUDA or MPS",
]

[tool.coverage.run]
branch = true
source = ["basat"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
packages = ["basat"]

[[tool.mypy.overrides]]
module = ["botorch.*", "gpytorch.*", "scipy.*", "sklearn.*", "cma.*", "cvxpy.*", "pyro.*", "numpyro.*", "umap.*", "matplotlib.*"]
ignore_missing_imports = true
